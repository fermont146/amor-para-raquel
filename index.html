<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❤️ Amor para Raquel</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: #f8ece3;
      overflow-x: hidden;
      position: relative;
      text-align: center;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("https://raw.githubusercontent.com/fermont146/amor-para-raquel/main/foto.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.18;
      z-index: -2;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 15px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      color: #8b2a50;
      margin-top: 30px;
      font-weight: bold;
    }

    .message {
      font-size: 22px;
      color: #3b2f2f;
      margin-top: 20px;
      line-height: 1.6;
    }

    .timer {
      margin-top: 28px;
      font-size: 24px;
      font-weight: bold;
      color: #8b2a50;
    }

    .tree {
      position: relative;
      width: 350px;
      height: 350px;
      margin: auto;
      margin-top: 30px;
    }

    .tree::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 46%;
      width: 8%;
      height: 38%;
      background: #8b4513;
      border-radius: 10px;
    }

    .heart {
      position: absolute;
      font-size: 18px;
      color: #e63946;
      opacity: 0.8;
    }

    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #fff8a2;
      border-radius: 50%;
      opacity: 0;
      box-shadow: 0 0 8px #fff8a2, 0 0 16px #fff8a2;
    }

    #playBtn {
      margin-top: 15px;
      font-size: 18px;
      background: #e63946;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 12px;
      cursor: pointer;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>❤️ Para mi amor, Raquel ❤️</h1>

    <div class="message">
      <p>Para el amor de mi vida:</p>
      <p>Si pudiera elegir un lugar seguro, sería a tu lado.</p>
      <p>Cuanto más tiempo estoy contigo, más te amo.</p>
      <p>— I Love You! —</p>
    </div>

    <!-- BOTÓN PARA ACTIVAR AUDIO -->
    <button id="playBtn">🎵 Reproducir música</button>

    <div class="tree" id="tree"></div>

    <div class="timer" id="timer"></div>
  </div>

  <!-- VIDEO YOUTUBE OCULTO -->
  <div id="ytMusic"></div>

  <script>
    // CONTADOR
    const startDate = new Date("2021-11-11T18:47:00");

    function updateTime() {
      const now = new Date();
      const diff = now - startDate;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("timer").innerText =
        `${days} días ${hours} horas ${minutes} minutos ${seconds} segundos`;
    }

    setInterval(updateTime, 1000);
    updateTime();

    // PÉTALOS
    const tree = document.getElementById("tree");

    function createPetal() {
      const petal = document.createElement("div");
      petal.className = "heart";
      petal.innerText = "❤️";

      petal.style.left = (Math.random() * 80 + 10) + "%";
      petal.style.fontSize = (16 + Math.random() * 14) + "px";

      tree.appendChild(petal);

      const dur = 4000 + Math.random() * 3000;

      petal.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${Math.random()*50 - 25}px, 200px) rotate(${Math.random()*720}deg)`, opacity: 0.7 },
        { transform: `translate(${Math.random()*100 - 50}px, 400px) rotate(${Math.random()*1080}deg)`, opacity: 0 }
      ], { duration: dur, easing: 'ease-in-out', fill: 'forwards' });

      setTimeout(() => petal.remove(), dur);
    }

    setInterval(createPetal, 250);

    // DESTELLOS
    function createSparkle() {
      const sparkle = document.createElement("div");
      sparkle.className = "sparkle";
      sparkle.style.top = (Math.random() * 100) + "%";
      sparkle.style.left = (Math.random() * 100) + "%";
      document.body.appendChild(sparkle);

      sparkle.animate([
        { opacity: 0 },
        { opacity: 1 },
        { opacity: 0 }
      ], { duration: 2000, easing: 'ease-in-out' });

      setTimeout(() => sparkle.remove(), 2000);
    }

    setInterval(createSparkle, 500);

    // YOUTUBE AUDIO OCULTO (solo se crea al tocar botón)
    const btn = document.getElementById("playBtn");
    btn.addEventListener("click", () => {
      const div = document.getElementById("ytMusic");
      div.innerHTML = `
        <iframe width="0" height="0"
          src="https://www.youtube.com/embed/Fvl5TbqJ-eI?autoplay=1&loop=1&playlist=Fvl5TbqJ-eI"
          frameborder="0" allow="autoplay; encrypted-media"></iframe>
      `;
      btn.style.display = "none";
    });

  </script>
</body>
</html>
