<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para Raquel ❤️</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: black;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
      }

      /* FONDO TIKTOK */
      .background {
        position: fixed;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #660000 0%, #000000 70%);
        z-index: -2;
      }

      .glow {
        position: absolute;
        width: 500px;
        height: 500px;
        background: red;
        border-radius: 50%;
        filter: blur(180px);
        animation: pulse 5s infinite ease-in-out;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.3);
          opacity: 0.3;
        }
        100% {
          transform: scale(1);
          opacity: 0.6;
        }
      }

      /* TEXTO CENTRAL */
      .scene {
        position: absolute;
        text-align: center;
        width: 90%;
        max-width: 500px;
        opacity: 0;
        transform: translateY(20px);
        transition: all 1.5s ease;
      }

      .scene.active {
        opacity: 1;
        transform: translateY(0);
      }

      h1 {
        font-size: 2rem;
        font-weight: 600;
      }

      .big {
        font-size: 2.4rem;
        font-weight: 800;
        color: #ff0000;
      }

      .footer {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.9rem;
        opacity: 0.7;
        text-align: center;
      }

      .countdown {
        font-size: 1.1rem;
        color: #ff6b9d;
        font-weight: 600;
        margin-top: 10px;
        opacity: 0;
        transition: opacity 2s ease;
      }

      .countdown.show {
        opacity: 1;
      }

      /* FOTO FINAL */
      .photo-container {
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 3s ease;
        z-index: 10;
      }

      .photo-container.show {
        opacity: 1;
      }

      .photo-container img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 20px;
        box-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
        animation: photoFloat 4s ease-in-out infinite;
      }

      @keyframes photoFloat {
        0%,
        100% {
          transform: scale(1) translateY(0);
        }
        50% {
          transform: scale(1.05) translateY(-10px);
        }
      }

      .photo-text {
        position: absolute;
        bottom: 50px;
        text-align: center;
        font-size: 1.3rem;
        color: #ff69b4;
        font-weight: 600;
        animation: pulse-text 2s ease-in-out infinite;
      }

      @keyframes pulse-text {
        0%,
        100% {
          opacity: 0.7;
        }
        50% {
          opacity: 1;
        }
      }

      /* CORAZONES */
      .heart {
        position: absolute;
        font-size: 20px;
        animation: floatUp 6s linear infinite;
      }

      @keyframes floatUp {
        0% {
          transform: translateY(0);
          opacity: 1;
        }
        100% {
          transform: translateY(-100vh);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="background"></div>
    <div class="glow"></div>

    <div class="scene active" id="scene1">
      <h1>Para el amor de mi vida...</h1>
    </div>

    <div class="scene" id="scene2">
      <h1>Si pudiera elegir un lugar seguro,<br />sería a tu lado.</h1>
    </div>

    <div class="scene" id="scene3">
      <h1>Cuanto más tiempo estoy contigo<br />más te amo.</h1>
    </div>

    <div class="scene" id="scene4">
      <h1>Eres mi razón de sonreír<br />cada mañana 😍</h1>
    </div>

    <div class="scene" id="scene5">
      <h1>Contigo quiero envejecer<br />y vivir infinitos momentos ✨</h1>
    </div>

    <div class="scene" id="scene6">
      <h1 class="big">Te amo gorda! 💕</h1>
    </div>

    <div class="footer">
      <div>Raquel Ramirez 🖤</div>
      <div class="countdown" id="countdown"></div>
    </div>

    <div class="photo-container" id="photoContainer">
      <!-- AGREGÁ LA URL DE VUESTRA FOTO AQUÍ -->
      <img src="/img1.jpg" alt="Nosotros" id="couplePhoto" />
      <div class="photo-text">Te amo infinitamente 💗</div>
    </div>

    <audio id="music" autoplay>
      <!-- CAMBÍA POR TU CANCIÓN DE AMOR (debe durar aprox 30-40 segundos) -->
      <source src="./mi_perdición.mp3" type="audio/mp3" />
    </audio>

    <script>
      // CAMBIO DE ESCENAS
      const scenes = document.querySelectorAll(".scene");
      let current = 0;
      let sceneInterval;
      let totalScenes = scenes.length;
      let timesLooped = 0;

      sceneInterval = setInterval(() => {
        scenes[current].classList.remove("active");
        current = (current + 1) % scenes.length;

        // Detectar cuando se completa un ciclo
        if (current === 0) {
          timesLooped++;
        }

        // Después de mostrar todas las escenas una vez, mostrar la cuenta regresiva
        if (timesLooped >= 1 && current === 0) {
          clearInterval(sceneInterval);
          mostrarCuentaRegresiva();
          // Mostrar la foto después de 4 segundos
          setTimeout(() => {
            document.getElementById("photoContainer").classList.add("show");
            const music = document.getElementById("music");
            music.pause();
          }, 4000);
        } else {
          scenes[current].classList.add("active");
        }
      }, 4000);

      // FUNCIÓN PARA MOSTRAR CUENTA REGRESIVA
      function mostrarCuentaRegresiva() {
        const countdownDiv = document.getElementById("countdown");
        const fechaNovio = new Date(2021, 10, 13); // 13/11/2021 (mes es 0-indexado)
        const ahora = new Date();

        const diferencia = ahora - fechaNovio;

        // Convertir a días, horas, minutos, segundos
        const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
        const horas = Math.floor(
          (diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
        );
        const minutos = Math.floor(
          (diferencia % (1000 * 60 * 60)) / (1000 * 60),
        );
        const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

        countdownDiv.innerHTML = `${dias} días, ${horas}h, ${minutos}m, ${segundos}s juntos 💕`;
        countdownDiv.classList.add("show");
      }

      // CORAZONES FLOTANDO SUAVES
      function crearCorazon() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.bottom = "-20px";
        heart.style.fontSize = Math.random() * 15 + 15 + "px";
        heart.style.animationDuration = Math.random() * 3 + 4 + "s";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
      }

      setInterval(crearCorazon, 800);
    </script>
  </body>
</html>
